<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Blumgi Rocket - Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap");

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        color: #fff;
        touch-action: manipulation;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .glow-cyan {
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
      }

      #game-canvas {
        border-radius: 16px;
        background: linear-gradient(180deg, #090d16 0%, #0f172a 60%, #020617 100%);
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
      }

      .ctrl-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: all 0.15s ease;
      }
      .ctrl-btn:active {
        transform: scale(0.92);
        background: rgba(6, 182, 212, 0.3);
        border-color: rgba(34, 211, 238, 0.5);
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center overflow-hidden select-none p-2 sm:p-4">
    <!-- Home Button -->
    <button onclick="window.location.href = '../index.html'" class="fixed top-4 left-4 z-50 flex items-center gap-2 px-4 py-2.5 rounded-2xl glass-card hover:bg-white/10 text-slate-200 text-xs sm:text-sm font-semibold transition-all duration-200 hover:scale-105 active:scale-95 shadow-lg"><span>🏠</span> Home</button>

    <div class="w-full max-w-[420px] flex flex-col items-center gap-3">
      <!-- Top Stats Bar -->
      <div class="w-full glass-panel rounded-2xl p-3 px-5 flex justify-between items-center border-b border-white/10">
        <div class="flex flex-col">
          <span class="text-[10px] tracking-wider uppercase font-extrabold text-cyan-400">STAGE</span>
          <span id="level-display" class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">LEVEL 1</span>
        </div>

        <div class="flex flex-col items-end">
          <span class="text-[10px] tracking-wider uppercase font-extrabold text-cyan-400">STAR SCORE</span>
          <span id="score-display" class="text-lg font-bold text-amber-300">⭐ 0</span>
        </div>
      </div>

      <!-- Game Canvas Viewport -->
      <div class="relative w-full glass-panel rounded-3xl p-2.5 flex flex-col items-center glow-cyan">
        <canvas id="game-canvas" width="380" height="420" class="w-full h-auto max-h-[55vh] object-contain"></canvas>

        <!-- On-Screen Touch Controls -->
        <div class="w-full grid grid-cols-3 gap-2 mt-2.5">
          <button id="btn-left" class="ctrl-btn py-3 rounded-xl flex items-center justify-center text-lg">👈</button>
          <button id="btn-boost" class="ctrl-btn py-3 rounded-xl flex items-center justify-center text-lg bg-cyan-500/20 border-cyan-400/40 font-bold">🚀 BOOST</button>
          <button id="btn-right" class="ctrl-btn py-3 rounded-xl flex items-center justify-center text-lg">👉</button>
        </div>

        <!-- Game Over / Win Modal Overlay -->
        <div id="modal-overlay" class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-3xl hidden flex-col justify-center items-center gap-4 z-40 p-6 text-center">
          <div id="modal-icon" class="w-16 h-16 rounded-2xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-3xl mb-1">💥</div>
          <h2 id="modal-title" class="text-2xl font-black text-cyan-400 tracking-wide">STAGE FAILED</h2>
          <p id="modal-subtitle" class="text-sm text-slate-300">Watch out for sharp obstacles!</p>
          <button id="modal-action-btn" onclick="restartLevel()" class="mt-2 px-8 py-3 rounded-2xl bg-gradient-to-r from-cyan-600 to-blue-600 font-extrabold text-white shadow-lg shadow-cyan-500/30 hover:scale-105 active:scale-95 transition-all duration-200">TRY AGAIN</button>
        </div>
      </div>

      <!-- Controls Hint -->
      <div class="hidden sm:flex justify-center items-center gap-4 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
        <span>A/D or ⬅️➡️ Drive / Tilt</span>
        <span>•</span>
        <span>Space / W / ⬆️ Rocket Boost</span>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("game-canvas");
      const ctx = canvas.getContext("2d");

      let currentLevel = 1;
      let score = 0;
      let isGameOver = false;
      let isWin = false;

      // Car / Rocket Specs - Fixed Boost Forces
      const car = {
        x: 60,
        y: 320,
        w: 34,
        h: 20,
        vx: 0,
        vy: 0,
        angle: 0,
        speed: 0.5,
        boostForce: 1.1, // Increased force
        gravity: 0.35,
        friction: 0.96,
        isGrounded: false,
      };

      let cameraX = 0;
      const keys = { left: false, right: false, boost: false };

      let platforms = [];
      let obstacles = [];
      let stars = [];
      let particles = [];
      let finishPortal = { x: 0, y: 0, r: 24 };

      function buildLevel(lvl) {
        platforms = [];
        obstacles = [];
        stars = [];

        platforms.push({ x: 0, y: 360, w: 220, h: 60 });

        if (lvl === 1) {
          platforms.push({ x: 260, y: 320, w: 180, h: 100 });
          platforms.push({ x: 500, y: 260, w: 220, h: 160 });
          platforms.push({ x: 780, y: 200, w: 200, h: 220 });

          obstacles.push({ type: "spike", x: 320, y: 305, w: 30, h: 15 });
          obstacles.push({ type: "saw", x: 580, y: 240, r: 16, angle: 0 });

          stars.push({ x: 280, y: 270, collected: false });
          stars.push({ x: 530, y: 210, collected: false });
          stars.push({ x: 810, y: 150, collected: false });

          finishPortal = { x: 920, y: 150, r: 24 };
        } else {
          platforms.push({ x: 240, y: 340, w: 140, h: 80 });
          platforms.push({ x: 440, y: 280, w: 140, h: 140 });
          platforms.push({ x: 650, y: 220, w: 160, h: 200 });
          platforms.push({ x: 880, y: 180, w: 200, h: 240 });

          obstacles.push({ type: "spike", x: 280, y: 325, w: 35, h: 15 });
          obstacles.push({ type: "saw", x: 500, y: 260, r: 18, angle: 0 });
          obstacles.push({ type: "spike", x: 700, y: 205, w: 40, h: 15 });

          stars.push({ x: 260, y: 290, collected: false });
          stars.push({ x: 480, y: 220, collected: false });
          stars.push({ x: 720, y: 160, collected: false });

          finishPortal = { x: 1000, y: 130, r: 24 };
        }
      }

      // Input Handlers
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
        if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
        if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") {
          if (!keys.boost && car.isGrounded) {
            car.vy = -7.5; // Instant Ground Jump Impulse
          }
          keys.boost = true;
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
        if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
        if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.boost = false;
      });

      const btnLeft = document.getElementById("btn-left");
      const btnRight = document.getElementById("btn-right");
      const btnBoost = document.getElementById("btn-boost");

      btnLeft.ontouchstart = (e) => {
        e.preventDefault();
        keys.left = true;
      };
      btnLeft.ontouchend = (e) => {
        e.preventDefault();
        keys.left = false;
      };
      btnRight.ontouchstart = (e) => {
        e.preventDefault();
        keys.right = true;
      };
      btnRight.ontouchend = (e) => {
        e.preventDefault();
        keys.right = false;
      };

      btnBoost.ontouchstart = (e) => {
        e.preventDefault();
        if (car.isGrounded) car.vy = -7.5;
        keys.boost = true;
      };
      btnBoost.ontouchend = (e) => {
        e.preventDefault();
        keys.boost = false;
      };

      function spawnRocketParticles() {
        const bx = car.x - Math.cos(car.angle) * 16;
        const by = car.y - Math.sin(car.angle) * 16;
        for (let i = 0; i < 3; i++) {
          particles.push({
            x: bx,
            y: by,
            vx: -Math.cos(car.angle) * (2 + Math.random() * 3),
            vy: -Math.sin(car.angle) * (2 + Math.random() * 3) - 1,
            r: 3 + Math.random() * 3,
            life: 1,
          });
        }
      }

      function update() {
        if (isGameOver || isWin) return;

        if (keys.left) {
          if (car.isGrounded) car.vx -= car.speed;
          car.angle -= 0.08;
        }
        if (keys.right) {
          if (car.isGrounded) car.vx += car.speed;
          car.angle += 0.08;
        }

        // Continuous Thrust
        if (keys.boost) {
          car.vx += Math.cos(car.angle) * car.boostForce;
          car.vy += Math.sin(car.angle) * car.boostForce - 0.2;
          spawnRocketParticles();
        }

        car.vy += car.gravity;
        car.vx *= car.friction;
        car.vy *= car.friction;

        car.x += car.vx;
        car.y += car.vy;

        particles.forEach((p, idx) => {
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.04;
          if (p.life <= 0) particles.splice(idx, 1);
        });

        // Platform Collisions
        car.isGrounded = false;
        platforms.forEach((p) => {
          if (car.x + car.w / 2 > p.x && car.x - car.w / 2 < p.x + p.w && car.y + car.h / 2 >= p.y && car.y + car.h / 2 <= p.y + 18 && car.vy >= 0) {
            car.y = p.y - car.h / 2;
            car.vy = 0;
            car.isGrounded = true;
            car.angle *= 0.75; // Auto-align angle on ground
          }
        });

        cameraX = car.x - 100;

        if (car.y > 460) {
          triggerGameOver("FALLEN OFF!", "Use your Rocket Boost to gain height.");
        }

        obstacles.forEach((obs) => {
          if (obs.type === "saw") {
            obs.angle += 0.08;
            let dx = car.x - obs.x;
            let dy = car.y - obs.y;
            if (Math.hypot(dx, dy) < obs.r + 12) {
              triggerGameOver("DESTROYED!", "Avoid spinning saw blades.");
            }
          } else if (obs.type === "spike") {
            if (car.x + car.w / 2 > obs.x && car.x - car.w / 2 < obs.x + obs.w && car.y + car.h / 2 > obs.y) {
              triggerGameOver("CRASHED!", "Avoid landing on sharp spikes.");
            }
          }
        });

        stars.forEach((s) => {
          if (!s.collected) {
            let dx = car.x - s.x;
            let dy = car.y - s.y;
            if (Math.hypot(dx, dy) < 24) {
              s.collected = true;
              score += 100;
              updateUI();
            }
          }
        });

        let pdx = car.x - finishPortal.x;
        let pdy = car.y - finishPortal.y;
        if (Math.hypot(pdx, pdy) < finishPortal.r + 10) {
          triggerWin();
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        particles.forEach((p) => {
          ctx.fillStyle = `rgba(34, 211, 238, ${p.life})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });

        platforms.forEach((p) => {
          ctx.fillStyle = "#1e293b";
          ctx.strokeStyle = "#06b6d4";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(p.x, p.y, p.w, p.h, 8);
          ctx.fill();
          ctx.stroke();
        });

        obstacles.forEach((obs) => {
          if (obs.type === "spike") {
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(obs.x, obs.y + obs.h);
            ctx.lineTo(obs.x + obs.w / 2, obs.y);
            ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
            ctx.closePath();
            ctx.fill();
          } else if (obs.type === "saw") {
            ctx.save();
            ctx.translate(obs.x, obs.y);
            ctx.rotate(obs.angle);
            ctx.fillStyle = "#f43f5e";
            ctx.beginPath();
            ctx.arc(0, 0, obs.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          }
        });

        stars.forEach((s) => {
          if (!s.collected) {
            ctx.font = "18px sans-serif";
            ctx.fillText("⭐", s.x - 9, s.y + 6);
          }
        });

        ctx.save();
        ctx.translate(finishPortal.x, finishPortal.y);
        ctx.fillStyle = "rgba(168, 85, 247, 0.3)";
        ctx.strokeStyle = "#a855f7";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, finishPortal.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.font = "20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🌀", 0, 0);
        ctx.restore();

        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);

        ctx.fillStyle = "#06b6d4";
        ctx.beginPath();
        ctx.roundRect(-car.w / 2, -car.h / 2, car.w, car.h, 6);
        ctx.fill();

        ctx.fillStyle = "#f59e0b";
        ctx.fillRect(-car.w / 2 - 6, -4, 6, 8);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(2, -6, 10, 6);

        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(-car.w / 4, car.h / 2, 5, 0, Math.PI * 2);
        ctx.arc(car.w / 4, car.h / 2, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        ctx.restore();
      }

      function updateUI() {
        document.getElementById("level-display").innerText = `LEVEL ${currentLevel}`;
        document.getElementById("score-display").innerText = `⭐ ${score}`;
      }

      function triggerGameOver(title, subtitle) {
        isGameOver = true;
        document.getElementById("modal-icon").innerText = "💥";
        document.getElementById("modal-title").innerText = title;
        document.getElementById("modal-subtitle").innerText = subtitle;
        document.getElementById("modal-action-btn").innerText = "RETRY LEVEL";
        document.getElementById("modal-overlay").style.display = "flex";
      }

      function triggerWin() {
        isWin = true;
        score += 300;
        updateUI();
        document.getElementById("modal-icon").innerText = "🌀";
        document.getElementById("modal-title").innerText = "PORTAL REACHED!";
        document.getElementById("modal-subtitle").innerText = "Incredible rocket stunt skills!";
        document.getElementById("modal-action-btn").innerText = "NEXT LEVEL";
        document.getElementById("modal-overlay").style.display = "flex";
      }

      function restartLevel() {
        if (isWin) currentLevel++;
        isGameOver = false;
        isWin = false;
        car.x = 60;
        car.y = 320;
        car.vx = 0;
        car.vy = 0;
        car.angle = 0;
        document.getElementById("modal-overlay").style.display = "none";
        buildLevel(currentLevel);
        updateUI();
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      buildLevel(currentLevel);
      updateUI();
      loop();
    </script>
  </body>
</html>
