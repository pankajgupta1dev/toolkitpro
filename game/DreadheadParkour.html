<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dreadhead Parkour - Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap");

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        color: #fff;
        touch-action: manipulation;
      }

      /* Glassmorphism Styling */
      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .glow-neon {
        box-shadow: 0 0 25px rgba(236, 72, 153, 0.3);
      }

      /* Custom Canvas Styling */
      #game-canvas {
        border-radius: 16px;
        background: linear-gradient(180deg, #0b0f19 0%, #111827 60%, #030712 100%);
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
      }

      /* Touch Control Buttons */
      .ctrl-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: all 0.15s ease;
      }
      .ctrl-btn:active {
        transform: scale(0.92);
        background: rgba(236, 72, 153, 0.3);
        border-color: rgba(244, 114, 182, 0.5);
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center overflow-hidden select-none p-2 sm:p-4">
    <!-- Floating Home Button -->
    <button onclick="window.location.href = '../index.html'" class="fixed top-4 left-4 z-50 flex items-center gap-2 px-4 py-2.5 rounded-2xl glass-card hover:bg-white/10 text-slate-200 text-xs sm:text-sm font-semibold transition-all duration-200 hover:scale-105 active:scale-95 shadow-lg"><span>🏠</span> Home</button>

    <!-- Main Game Layout -->
    <div class="w-full max-w-[420px] flex flex-col items-center gap-3">
      <!-- Top Stats Bar -->
      <div class="w-full glass-panel rounded-2xl p-3 px-5 flex justify-between items-center border-b border-white/10">
        <div class="flex flex-col">
          <span class="text-[10px] tracking-wider uppercase font-extrabold text-pink-400">STAGE</span>
          <span id="level-display" class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">LEVEL 1</span>
        </div>

        <div class="flex flex-col items-end">
          <span class="text-[10px] tracking-wider uppercase font-extrabold text-pink-400">STAR SCORE</span>
          <span id="score-display" class="text-lg font-bold text-amber-300">⭐ 0</span>
        </div>
      </div>

      <!-- Game Canvas Viewport -->
      <div class="relative w-full glass-panel rounded-3xl p-2.5 flex flex-col items-center glow-neon">
        <canvas id="game-canvas" width="380" height="420" class="w-full h-auto max-h-[55vh] object-contain"></canvas>

        <!-- On-Screen Touch Controls (Mobile) -->
        <div class="w-full grid grid-cols-4 gap-2 mt-2.5">
          <button id="btn-left" class="ctrl-btn py-3 rounded-xl flex items-center justify-center text-lg">👈</button>
          <button id="btn-right" class="ctrl-btn py-3 rounded-xl flex items-center justify-center text-lg">👉</button>
          <button id="btn-slide" class="ctrl-btn py-3 rounded-xl flex items-center justify-center text-lg">🛹</button>
          <button id="btn-jump" class="ctrl-btn py-3 rounded-xl flex items-center justify-center text-lg">🦘</button>
        </div>

        <!-- Game Over / Win Modal Overlay -->
        <div id="modal-overlay" class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-3xl hidden flex-col justify-center items-center gap-4 z-40 p-6 text-center">
          <div id="modal-icon" class="w-16 h-16 rounded-2xl bg-pink-500/20 border border-pink-500/40 flex items-center justify-center text-3xl mb-1">💥</div>
          <h2 id="modal-title" class="text-2xl font-black text-pink-400 tracking-wide">STAGE FAILED</h2>
          <p id="modal-subtitle" class="text-sm text-slate-300">Watch out for sharp obstacles!</p>
          <button id="modal-action-btn" onclick="restartLevel()" class="mt-2 px-8 py-3 rounded-2xl bg-gradient-to-r from-pink-600 to-purple-600 font-extrabold text-white shadow-lg shadow-pink-500/30 hover:scale-105 active:scale-95 transition-all duration-200">TRY AGAIN</button>
        </div>
      </div>

      <!-- Desktop Controls Hint -->
      <div class="hidden sm:flex justify-center items-center gap-4 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
        <span>A/D or ⬅️➡️ Move</span>
        <span>•</span>
        <span>W or ⬆️ Jump / Flip</span>
        <span>•</span>
        <span>S or ⬇️ Slide</span>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("game-canvas");
      const ctx = canvas.getContext("2d");

      // Game Variables
      let currentLevel = 1;
      let score = 0;
      let isGameOver = false;
      let isWin = false;

      // Player Object
      const player = {
        x: 50,
        y: 300,
        w: 24,
        h: 40,
        normalH: 40,
        slideH: 20,
        vx: 0,
        vy: 0,
        speed: 3.8,
        jumpForce: -9.5,
        gravity: 0.48,
        isGrounded: false,
        jumpCount: 0,
        maxJumps: 2,
        isSliding: false,
        angle: 0,
        rotationSpeed: 0,
      };

      // Camera
      let cameraX = 0;

      // Control Keys State
      const keys = { left: false, right: false, jump: false, slide: false };

      // Level Level Structures
      let platforms = [];
      let obstacles = [];
      let stars = [];
      let finishFlag = { x: 0, y: 0, w: 30, h: 50 };

      function buildLevel(lvl) {
        platforms = [];
        obstacles = [];
        stars = [];

        // Base Starter Ground
        platforms.push({ x: 0, y: 380, w: 220, h: 40 });

        if (lvl === 1) {
          platforms.push({ x: 280, y: 340, w: 180, h: 80 });
          platforms.push({ x: 520, y: 300, w: 200, h: 120 });
          platforms.push({ x: 780, y: 260, w: 220, h: 160 });

          // Spikes
          obstacles.push({ type: "spike", x: 340, y: 325, w: 30, h: 15 });
          // Saw
          obstacles.push({ type: "saw", x: 600, y: 280, r: 16, angle: 0 });

          // Stars
          stars.push({ x: 300, y: 290, collected: false });
          stars.push({ x: 550, y: 250, collected: false });
          stars.push({ x: 820, y: 210, collected: false });

          finishFlag = { x: 940, y: 210, w: 30, h: 50 };
        } else {
          platforms.push({ x: 260, y: 350, w: 140, h: 70 });
          platforms.push({ x: 460, y: 310, w: 130, h: 110 });
          platforms.push({ x: 650, y: 270, w: 150, h: 150 });
          platforms.push({ x: 870, y: 230, w: 200, h: 190 });

          obstacles.push({ type: "spike", x: 300, y: 335, w: 35, h: 15 });
          obstacles.push({ type: "saw", x: 510, y: 290, r: 18, angle: 0 });
          obstacles.push({ type: "high_barrier", x: 700, y: 210, w: 15, h: 60 }); // Requires Slide/Dodge or Precise Jump

          stars.push({ x: 280, y: 300, collected: false });
          stars.push({ x: 490, y: 260, collected: false });
          stars.push({ x: 720, y: 170, collected: false });

          finishFlag = { x: 1010, y: 180, w: 30, h: 50 };
        }
      }

      // Input Listeners
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
        if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
        if ((e.key === "ArrowUp" || e.key === "w" || e.key === " ") && !keys.jump) {
          keys.jump = true;
          triggerJump();
        }
        if (e.key === "ArrowDown" || e.key === "s") {
          keys.slide = true;
          player.isSliding = true;
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
        if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
        if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.jump = false;
        if (e.key === "ArrowDown" || e.key === "s") {
          keys.slide = false;
          player.isSliding = false;
        }
      });

      // Touch Controls
      const btnLeft = document.getElementById("btn-left");
      const btnRight = document.getElementById("btn-right");
      const btnJump = document.getElementById("btn-jump");
      const btnSlide = document.getElementById("btn-slide");

      btnLeft.ontouchstart = (e) => {
        e.preventDefault();
        keys.left = true;
      };
      btnLeft.ontouchend = (e) => {
        e.preventDefault();
        keys.left = false;
      };
      btnRight.ontouchstart = (e) => {
        e.preventDefault();
        keys.right = true;
      };
      btnRight.ontouchend = (e) => {
        e.preventDefault();
        keys.right = false;
      };

      btnJump.ontouchstart = (e) => {
        e.preventDefault();
        triggerJump();
      };
      btnSlide.ontouchstart = (e) => {
        e.preventDefault();
        keys.slide = true;
        player.isSliding = true;
      };
      btnSlide.ontouchend = (e) => {
        e.preventDefault();
        keys.slide = false;
        player.isSliding = false;
      };

      function triggerJump() {
        if (isGameOver || isWin) return;
        if (player.jumpCount < player.maxJumps) {
          player.vy = player.jumpForce;
          player.isGrounded = false;
          player.jumpCount++;
          player.rotationSpeed = 0.25; // Flip effect in air
        }
      }

      // Physics Engine Update
      function update() {
        if (isGameOver || isWin) return;

        // Horizontal Velocity
        if (keys.left) player.vx = -player.speed;
        else if (keys.right) player.vx = player.speed;
        else player.vx *= 0.8;

        // Height adjust on sliding
        player.h = player.isSliding ? player.slideH : player.normalH;

        // Gravity Application
        player.vy += player.gravity;

        // Position update
        player.x += player.vx;
        player.y += player.vy;

        // Air Rotation (Backflips)
        if (!player.isGrounded) {
          player.angle += player.rotationSpeed;
        } else {
          player.angle = 0;
          player.rotationSpeed = 0;
        }

        // Platform Collision Detection
        player.isGrounded = false;
        platforms.forEach((p) => {
          if (player.x + player.w > p.x && player.x < p.x + p.w && player.y + player.h >= p.y && player.y + player.h <= p.y + 15 && player.vy >= 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.isGrounded = true;
            player.jumpCount = 0;
          }
        });

        // Camera Offset tracking
        cameraX = player.x - 100;

        // Check Death (Fall out of bounds)
        if (player.y > 450) {
          triggerGameOver("FALLEN OFF!", "Careful with your jumps next time.");
        }

        // Check Obstacle Collisions
        obstacles.forEach((obs) => {
          if (obs.type === "saw") {
            obs.angle += 0.08;
            let dx = player.x + player.w / 2 - obs.x;
            let dy = player.y + player.h / 2 - obs.y;
            let dist = Math.hypot(dx, dy);
            if (dist < obs.r + 10) {
              triggerGameOver("SLICED BY SAW!", "Watch out for spinning blades.");
            }
          } else if (obs.type === "spike") {
            if (player.x + player.w > obs.x && player.x < obs.x + obs.w && player.y + player.h > obs.y) {
              triggerGameOver("SPIKED!", "Avoid landing on sharp spikes.");
            }
          } else if (obs.type === "high_barrier") {
            if (player.x + player.w > obs.x && player.x < obs.x + obs.w && player.y < obs.y + obs.h && player.y + player.h > obs.y) {
              if (!player.isSliding) {
                triggerGameOver("HIT BARRIER!", "Use SLIDE (S / 🛹) to pass low under high barriers.");
              }
            }
          }
        });

        // Star Collection
        stars.forEach((s) => {
          if (!s.collected) {
            let dx = player.x + player.w / 2 - s.x;
            let dy = player.y + player.h / 2 - s.y;
            if (Math.hypot(dx, dy) < 22) {
              s.collected = true;
              score += 100;
              updateUI();
            }
          }
        });

        // Finish Line Goal
        if (player.x + player.w > finishFlag.x && player.x < finishFlag.x + finishFlag.w && player.y + player.h >= finishFlag.y) {
          triggerWin();
        }
      }

      // Render Function
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        // Render Platforms
        platforms.forEach((p) => {
          ctx.fillStyle = "#1e293b";
          ctx.strokeStyle = "#ec4899";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(p.x, p.y, p.w, p.h, 6);
          ctx.fill();
          ctx.stroke();
        });

        // Render Obstacles
        obstacles.forEach((obs) => {
          if (obs.type === "spike") {
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(obs.x, obs.y + obs.h);
            ctx.lineTo(obs.x + obs.w / 2, obs.y);
            ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
            ctx.closePath();
            ctx.fill();
          } else if (obs.type === "saw") {
            ctx.save();
            ctx.translate(obs.x, obs.y);
            ctx.rotate(obs.angle);
            ctx.fillStyle = "#f43f5e";
            ctx.beginPath();
            ctx.arc(0, 0, obs.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          } else if (obs.type === "high_barrier") {
            ctx.fillStyle = "#a855f7";
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
          }
        });

        // Render Stars
        stars.forEach((s) => {
          if (!s.collected) {
            ctx.font = "18px sans-serif";
            ctx.fillText("⭐", s.x - 9, s.y + 6);
          }
        });

        // Render Finish Goal Flag
        ctx.fillStyle = "#10b981";
        ctx.fillRect(finishFlag.x, finishFlag.y, 6, finishFlag.h);
        ctx.fillStyle = "#34d399";
        ctx.beginPath();
        ctx.moveTo(finishFlag.x + 6, finishFlag.y);
        ctx.lineTo(finishFlag.x + 28, finishFlag.y + 12);
        ctx.lineTo(finishFlag.x + 6, finishFlag.y + 24);
        ctx.closePath();
        ctx.fill();

        // Render Dreadhead Player Character
        ctx.save();
        ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
        ctx.rotate(player.angle);

        // Body / Hoodie
        ctx.fillStyle = "#ec4899";
        ctx.beginPath();
        ctx.roundRect(-player.w / 2, -player.h / 2, player.w, player.h, 6);
        ctx.fill();

        // Dreadlocks Hair Effect (Top/Back)
        ctx.fillStyle = "#f59e0b";
        ctx.fillRect(-player.w / 2 - 4, -player.h / 2 - 4, 10, 14);
        ctx.fillRect(-player.w / 2 - 8, -player.h / 2 + 2, 8, 12);

        // Face / Visor
        ctx.fillStyle = "#06b6d4";
        ctx.fillRect(2, -player.h / 2 + 6, 8, 6);

        ctx.restore();

        ctx.restore();
      }

      function updateUI() {
        document.getElementById("level-display").innerText = `LEVEL ${currentLevel}`;
        document.getElementById("score-display").innerText = `⭐ ${score}`;
      }

      function triggerGameOver(title, subtitle) {
        isGameOver = true;
        document.getElementById("modal-icon").innerText = "💥";
        document.getElementById("modal-title").innerText = title;
        document.getElementById("modal-subtitle").innerText = subtitle;
        document.getElementById("modal-action-btn").innerText = "RETRY LEVEL";
        document.getElementById("modal-overlay").style.display = "flex";
      }

      function triggerWin() {
        isWin = true;
        score += 300;
        updateUI();
        document.getElementById("modal-icon").innerText = "🏆";
        document.getElementById("modal-title").innerText = "LEVEL COMPLETE!";
        document.getElementById("modal-subtitle").innerText = "Awesome parkour skills!";
        document.getElementById("modal-action-btn").innerText = "NEXT LEVEL";
        document.getElementById("modal-overlay").style.display = "flex";
      }

      function restartLevel() {
        if (isWin) {
          currentLevel++;
        }
        isGameOver = false;
        isWin = false;
        player.x = 50;
        player.y = 300;
        player.vx = 0;
        player.vy = 0;
        document.getElementById("modal-overlay").style.display = "none";
        buildLevel(currentLevel);
        updateUI();
      }

      // Main Game Loop
      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      buildLevel(currentLevel);
      updateUI();
      loop();
    </script>
  </body>
</html>
