<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tower Swap</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body {
        background-color: #0f0f15;
        color: #fff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        padding: 10px;
      }

      .back-btn {
        position: absolute;
        top: 12px;
        left: 12px;
        background: #2563eb;
        color: white;
        padding: 8px 14px;
        font-weight: 600;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-size: 13px;
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        transition: background 0.2s;
        z-index: 50;
      }
      .back-btn:hover {
        background: #3b82f6;
      }

      #game-wrapper {
        width: 100%;
        max-width: 400px;
        height: 95vh;
        max-height: 720px;
        background-color: #161622;
        border: 2px solid #2e2e40;
        border-radius: 16px;
        position: relative;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }

      #ui-bar {
        height: 44px;
        background: #101018;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 16px;
        border-bottom: 2px solid #2e2e40;
        flex-shrink: 0;
      }
      .stat-box {
        font-weight: bold;
        font-size: 14px;
        color: #ffd700;
      }

      #game-canvas {
        width: 100%;
        flex-grow: 1;
        background: #09090e;
        display: block;
        min-height: 180px;
      }

      /* Grid Area - Fixed Overflow & Cut Issue */
      #grid-area {
        height: 290px;
        background: #181826;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 8px;
        padding: 10px;
        border-top: 2px solid #2e2e40;
        flex-shrink: 0;
      }
      .tile {
        background: #242436;
        border: 2px solid #3a3a52;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        cursor: pointer;
        transition:
          transform 0.15s,
          border-color 0.15s;
        padding: 4px;
        overflow: hidden;
      }
      .tile:active {
        transform: scale(0.95);
      }
      .tile.selected {
        border-color: #00d2d3;
        box-shadow: 0 0 10px #00d2d3;
        background: #2c2c44;
      }
      .tile-name {
        font-size: 11px;
        color: #cbd5e1;
        margin-top: 2px;
        font-weight: 600;
        white-space: nowrap;
      }

      #game-over-modal {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 100;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #game-over-modal h1 {
        color: #ff4757;
        margin-bottom: 8px;
      }
      .btn {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        border: none;
        padding: 10px 22px;
        color: white;
        font-weight: bold;
        font-size: 14px;
        border-radius: 18px;
        cursor: pointer;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <button onclick="window.location.href = '../index.html'" class="back-btn">🏠 Home</button>

    <div id="game-wrapper">
      <div id="ui-bar">
        <div class="stat-box" id="moves-display">⏳ Swaps: 12</div>
        <div class="stat-box" style="color: #ff4757" id="score-display">🎯 Score: 0</div>
      </div>

      <canvas id="game-canvas"></canvas>

      <div id="grid-area">
        <div class="tile" data-idx="0"></div>
        <div class="tile" data-idx="1"></div>
        <div class="tile" data-idx="2"></div>
        <div class="tile" data-idx="3"></div>
        <div class="tile" data-idx="4"></div>
        <div class="tile" data-idx="5"></div>
        <div class="tile" data-idx="6"></div>
        <div class="tile" data-idx="7"></div>
        <div class="tile" data-idx="8"></div>
      </div>

      <div id="game-over-modal">
        <h1>GAME OVER</h1>
        <p id="final-score">Final Score: 0</p>
        <button class="btn" onclick="resetGame()">Play Again</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("game-canvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
      }
      window.addEventListener("resize", resizeCanvas);

      let score = 0;
      let swapsLeft = 12;
      let isGameOver = false;

      const TILE_TYPES = {
        0: { name: "Wood", icon: "🪵", damage: 0, level: 0 },
        1: { name: "Stone", icon: "🪨", damage: 0, level: 1 },
        2: { name: "Archer", icon: "🏹", damage: 10, level: 2, fireRate: 35 },
        3: { name: "Cannon", icon: "💣", damage: 25, level: 3, fireRate: 50 },
        4: { name: "Dragon", icon: "🐲", damage: 60, level: 4, fireRate: 65 },
      };

      let grid = [0, 1, 0, 1, 2, 0, 0, 1, 0];
      let selectedTileIdx = null;

      let enemies = [];
      let bullets = [];
      let enemySpawnTimer = 0;
      let weaponTimers = new Array(9).fill(0);

      class Enemy {
        constructor() {
          this.width = 40;
          this.height = 34;
          this.x = Math.random() * (canvas.width - this.width);
          this.y = -this.height;
          this.speed = 0.5 + Math.random() * 0.3;
          this.maxHp = Math.floor(15 + score * 1.5);
          this.hp = this.maxHp;
        }

        update() {
          this.y += this.speed;
          if (this.y + this.height >= canvas.height) {
            triggerGameOver();
          }
        }

        draw() {
          ctx.fillStyle = "#ff4757";
          ctx.beginPath();
          ctx.roundRect(this.x, this.y, this.width, this.height, 6);
          ctx.fill();

          ctx.fillStyle = "#2ed573";
          const hpWidth = (this.hp / this.maxHp) * this.width;
          ctx.fillRect(this.x, this.y - 6, Math.max(0, hpWidth), 4);

          ctx.fillStyle = "#fff";
          ctx.font = "bold 11px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("🐲 " + Math.ceil(this.hp), this.x + this.width / 2, this.y + 22);
        }
      }

      class Bullet {
        constructor(x, y, damage, target) {
          this.x = x;
          this.y = y;
          this.damage = damage;
          this.target = target;
          this.speed = 7;
        }

        update() {
          if (!this.target || this.target.hp <= 0) return true;

          const dx = this.target.x + this.target.width / 2 - this.x;
          const dy = this.target.y + this.target.height / 2 - this.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 10) {
            this.target.hp -= this.damage;
            return true;
          }

          this.x += (dx / dist) * this.speed;
          this.y += (dy / dist) * this.speed;
          return false;
        }

        draw() {
          ctx.fillStyle = "#ffd700";
          ctx.beginPath();
          ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function renderGrid() {
        const tileEls = document.querySelectorAll(".tile");
        tileEls.forEach((el, idx) => {
          const typeId = grid[idx];
          const tileData = TILE_TYPES[typeId];

          el.innerHTML = `<span>${tileData.icon}</span><span class="tile-name">${tileData.name}</span>`;
          el.classList.remove("selected");

          if (selectedTileIdx === idx) {
            el.classList.add("selected");
          }
        });

        document.getElementById("moves-display").innerText = `⏳ Swaps: ${swapsLeft}`;
        document.getElementById("score-display").innerText = `🎯 Score: ${score}`;
      }

      document.querySelectorAll(".tile").forEach((el) => {
        el.addEventListener("click", () => {
          if (isGameOver) return;

          const clickedIdx = parseInt(el.getAttribute("data-idx"));

          if (selectedTileIdx === null) {
            selectedTileIdx = clickedIdx;
          } else if (selectedTileIdx === clickedIdx) {
            selectedTileIdx = null;
          } else {
            if (isAdjacent(selectedTileIdx, clickedIdx)) {
              swapTiles(selectedTileIdx, clickedIdx);
              swapsLeft--;
              checkMatches();
              selectedTileIdx = null;

              if (swapsLeft <= 0 && enemies.length === 0) {
                swapsLeft += 4;
              }
            } else {
              selectedTileIdx = clickedIdx;
            }
          }
          renderGrid();
        });
      });

      function isAdjacent(idx1, idx2) {
        const r1 = Math.floor(idx1 / 3),
          c1 = idx1 % 3;
        const r2 = Math.floor(idx2 / 3),
          c2 = idx2 % 3;
        return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
      }

      function swapTiles(i, j) {
        const temp = grid[i];
        grid[i] = grid[j];
        grid[j] = temp;
      }

      function checkMatches() {
        let matched = false;
        const lines = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8],
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8],
        ];

        for (let line of lines) {
          const [a, b, c] = line;
          if (grid[a] === grid[b] && grid[b] === grid[c]) {
            const currentLevel = grid[a];
            if (currentLevel < 4) {
              grid[a] = currentLevel + 1;
              grid[b] = Math.floor(Math.random() * 2);
              grid[c] = Math.floor(Math.random() * 2);
              score += 25;
              swapsLeft += 1;
              matched = true;
            }
          }
        }

        if (matched) renderGrid();
      }

      function triggerGameOver() {
        isGameOver = true;
        document.getElementById("final-score").innerText = `Final Score: ${score}`;
        document.getElementById("game-over-modal").style.display = "flex";
      }

      function resetGame() {
        score = 0;
        swapsLeft = 12;
        grid = [0, 1, 0, 1, 2, 0, 0, 1, 0];
        enemies = [];
        bullets = [];
        isGameOver = false;
        document.getElementById("game-over-modal").style.display = "none";
        renderGrid();
        gameLoop();
      }

      function gameLoop() {
        if (isGameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        enemySpawnTimer++;
        if (enemySpawnTimer > 110) {
          enemies.push(new Enemy());
          enemySpawnTimer = 0;
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          enemy.update();
          enemy.draw();

          if (enemy.hp <= 0) {
            score += 15;
            enemies.splice(i, 1);
            renderGrid();
          }
        }

        grid.forEach((typeId, idx) => {
          const tileData = TILE_TYPES[typeId];
          if (tileData.damage > 0) {
            weaponTimers[idx]++;
            if (weaponTimers[idx] >= tileData.fireRate) {
              if (enemies.length > 0) {
                let target = enemies[0];
                for (let e of enemies) {
                  if (e.y > target.y) target = e;
                }

                const col = idx % 3;
                const fireX = (col + 0.5) * (canvas.width / 3);
                const fireY = canvas.height;

                bullets.push(new Bullet(fireX, fireY, tileData.damage, target));
                weaponTimers[idx] = 0;
              }
            }
          }
        });

        for (let i = bullets.length - 1; i >= 0; i--) {
          const bullet = bullets[i];
          const hit = bullet.update();
          bullet.draw();
          if (hit) bullets.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
      }

      resizeCanvas();
      renderGrid();
      gameLoop();
    </script>
  </body>
</html>
